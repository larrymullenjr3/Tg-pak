<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Device Verification</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            color: #ffffff;
            background:
                radial-gradient(circle at 50% 20%, #173b63 0%, #091421 35%, #03070c 75%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 30px 22px;
            text-align: center;
        }

        .shield-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(75, 170, 255, 0.25);
            border-top-color: #48aaff;
            animation: spin 1.8s linear infinite;
        }

        .ring::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1px solid rgba(75, 170, 255, 0.15);
        }

        .shield {
            width: 76px;
            height: 86px;
            background: linear-gradient(145deg, #329cff, #1264c7);
            clip-path: polygon(
                50% 0%,
                91% 15%,
                91% 52%,
                80% 72%,
                50% 100%,
                20% 72%,
                9% 52%,
                9% 15%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 30px rgba(50, 156, 255, 0.45);
        }

        .check {
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #9eafc1;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .status-box {
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            padding: 18px;
            backdrop-filter: blur(10px);
        }

        .status {
            font-size: 15px;
            color: #cbd7e3;
        }

        .loader {
            width: 100%;
            height: 4px;
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-bar {
            width: 35%;
            height: 100%;
            background: #43a7ff;
            border-radius: 10px;
            animation: loading 1.4s ease-in-out infinite;
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-message {
            color: #aebdca;
            font-size: 15px;
            line-height: 1.5;
        }

        .success {
            border-color: rgba(60, 220, 140, 0.25);
        }

        .info {
            border-color: rgba(70, 170, 255, 0.25);
        }

        .error {
            border-color: rgba(255, 80, 80, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .footer {
            margin-top: 25px;
            color: #526171;
            font-size: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes loading {
            0% {
                transform: translateX(-130%);
            }
            100% {
                transform: translateX(400%);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div id="checking">

        <div class="shield-wrapper">
            <div class="ring"></div>

            <div class="shield">
                <div class="check">✓</div>
            </div>
        </div>

        <h1>Device Verification</h1>

        <p class="subtitle">
            Checking your device and account securely...
        </p>

        <div class="status-box">
            <div class="status" id="checkingText">
                Initializing secure verification...
            </div>

            <div class="loader">
                <div class="loader-bar"></div>
            </div>
        </div>

    </div>


    <div id="result" class="hidden">

        <div class="result-icon" id="resultIcon">✓</div>

        <div class="result-title" id="resultTitle">
            Device Verified
        </div>

        <div class="status-box" id="resultBox">
            <div class="result-message" id="resultMessage">
                Your device has been successfully verified.
            </div>
        </div>

    </div>


    <div class="footer">
        Secure Device Verification
    </div>

</div>


<script>
(function () {

    "use strict";

    const LOVABLE_VERIFY_URL =
        "https://tg-device-guard.lovable.app/api/public/tg-client/verify.php";

    const DEVICE_KEY =
        "tg_device_verification_id";

    const tg =
        window.Telegram && window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;


    if (tg) {
        try {
            tg.ready();
            tg.expand();
        } catch (e) {
            console.log("Telegram WebApp initialization failed:", e);
        }
    }


    function updateChecking(text) {
        const element =
            document.getElementById("checkingText");

        if (element) {
            element.textContent = text;
        }
    }


    function showResult(type, title, message) {

        document.getElementById("checking")
            .classList.add("hidden");

        const result =
            document.getElementById("result");

        const box =
            document.getElementById("resultBox");

        const icon =
            document.getElementById("resultIcon");

        const titleElement =
            document.getElementById("resultTitle");

        const messageElement =
            document.getElementById("resultMessage");


        result.classList.remove("hidden");

        box.className = "status-box " + type;

        titleElement.textContent = title;
        messageElement.textContent = message;


        if (type === "success") {
            icon.textContent = "✓";
        }
        else if (type === "info") {
            icon.textContent = "✓";
        }
        else {
            icon.textContent = "!";
        }
    }


    function getBotHash() {

        const params =
            new URLSearchParams(window.location.search);

        return params.get("bot_hash");
    }


    function createDeviceId() {

        if (
            window.crypto &&
            typeof window.crypto.randomUUID === "function"
        ) {
            return window.crypto.randomUUID();
        }

        return (
            "device-" +
            Date.now() +
            "-" +
            Math.random().toString(36).substring(2) +
            "-" +
            Math.random().toString(36).substring(2)
        );
    }


    async function getDeviceId() {

        /*
         * Telegram CloudStorage is preferred because
         * it can persist the identifier across Mini App sessions.
         */

        if (
            tg &&
            tg.CloudStorage &&
            typeof tg.CloudStorage.getItem === "function"
        ) {

            try {

                const existing =
                    await new Promise((resolve) => {

                        tg.CloudStorage.getItem(
                            DEVICE_KEY,
                            (error, value) => {

                                if (error) {
                                    resolve(null);
                                }
                                else {
                                    resolve(value || null);
                                }
                            }
                        );

                    });


                if (existing) {
                    return existing;
                }


                const newId =
                    createDeviceId();


                await new Promise((resolve) => {

                    tg.CloudStorage.setItem(
                        DEVICE_KEY,
                        newId,
                        () => resolve()
                    );

                });


                return newId;

            }
            catch (error) {

                console.log(
                    "Telegram CloudStorage unavailable:",
                    error
                );
            }
        }


        /*
         * Browser fallback.
         */

        try {

            let existing =
                localStorage.getItem(DEVICE_KEY);

            if (existing) {
                return existing;
            }


            const newId =
                createDeviceId();

            localStorage.setItem(
                DEVICE_KEY,
                newId
            );

            return newId;

        }
        catch (error) {

            /*
             * Final fallback if localStorage is unavailable.
             */

            return createDeviceId();
        }
    }


    async function verifyDevice() {

        updateChecking(
            "Preparing secure verification..."
        );


        const botHash =
            getBotHash();


        if (!botHash) {

            showResult(
                "error",
                "Invalid Verification",
                "The verification link is missing the required bot identifier."
            );

            return;
        }


        if (!tg || !tg.initData) {

            showResult(
                "error",
                "Open in Telegram",
                "Please open this verification page from the Telegram bot."
            );

            return;
        }


        updateChecking(
            "Creating secure device identifier..."
        );


        const deviceId =
            await getDeviceId();


        updateChecking(
            "Checking your device..."
        );


        try {

            const response =
                await fetch(
                    LOVABLE_VERIFY_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            bot_hash:
                                botHash,

                            init_data:
                                tg.initData,

                            device_id:
                                deviceId

                        })
                    }
                );


            let data;


            try {
                data = await response.json();
            }
            catch (error) {

                showResult(
                    "error",
                    "Verification Error",
                    "The verification server returned an invalid response."
                );

                return;
            }


            if (
                data.status === "success"
            ) {

                showResult(
                    "success",
                    data.title ||
                        "Device Verified",
                    data.message ||
                        "Your device has been successfully verified."
                );

                return;
            }


            if (
                data.status === "info"
            ) {

                showResult(
                    "info",
                    data.title ||
                        "Device Recognized",
                    data.message ||
                        "Your device is already verified."
                );

                return;
            }


            if (
                data.status === "error"
            ) {

                showResult(
                    "error",
                    data.title ||
                        "Security Violation",
                    data.message ||
                        "Device verification failed."
                );

                return;
            }


            showResult(
                "error",
                "Verification Error",
                "The verification server returned an unknown status."
            );

        }
        catch (error) {

            console.error(
                "Verification request failed:",
                error
            );

            showResult(
                "error",
                "Connection Error",
                "Unable to contact the verification server. Please try again."
            );
        }
    }


    /*
     * Start after the page has loaded.
     */

    if (
        document.readyState === "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            verifyDevice
        );

    }
    else {

        verifyDevice();

    }

})();
</script>

</body>
    </html>
