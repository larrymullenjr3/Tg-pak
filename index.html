<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Close Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0f172a;font-family:Arial,sans-serif}
.card{width:100%;max-width:360px;padding:28px 22px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px}
h2{margin:0 0 20px;color:#fff;font-size:22px}
button{width:100%;border:0;border-radius:12px;padding:14px 18px;background:#3b82f6;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="card">
<h2>Mini App Open</h2>
<button type="button" onclick="closeMiniApp()">Close Mini App</button>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
function closeMiniApp(){if(tg)tg.close();}
</script>
</body>
</html>
