<script>

"use strict";


// ==================================================
// TELEGRAM
// ==================================================

const tg =
    window.Telegram &&
    window.Telegram.WebApp;


// ==================================================
// API
// ==================================================

const API_URL =
    "https://tg-device-guard.lovable.app/api/public/tg-client/verify.php";


// ==================================================
// RETURN URL
// ==================================================

const RETURN_URL =
    "https://uplcm.com/4/12100565";


// ==================================================
// TELEGRAM INITIALIZATION
// ==================================================

if (tg) {

    try {

        tg.ready();

        tg.expand();

    } catch (error) {

        console.log(
            "Telegram initialization error:",
            error
        );

    }

}


// ==================================================
// URL PARAMETERS
// ==================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const botHash =
    params.get("bot_hash");


const botUsername =
    params.get("bot") || "";


// ==================================================
// LOADING STATUS
// ==================================================

function setLoadingStatus(text) {

    const element =
        document.getElementById(
            "loadingStatus"
        );


    if (element) {

        element.textContent =
            text;

    }

}


// ==================================================
// SHOW RESULT
// ==================================================

function showResult(
    status,
    title,
    message
) {

    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );


    const resultScreen =
        document.getElementById(
            "resultScreen"
        );


    const resultIcon =
        document.getElementById(
            "resultIcon"
        );


    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    const resultMessage =
        document.getElementById(
            "resultMessage"
        );


    loadingScreen.classList.add(
        "hidden"
    );


    resultScreen.classList.remove(
        "hidden"
    );


    resultScreen.classList.remove(
        "success",
        "error",
        "info"
    );


    if (status === "success") {

        resultScreen.classList.add(
            "success"
        );

        resultIcon.textContent =
            "✓";

    }

    else if (status === "error") {

        resultScreen.classList.add(
            "error"
        );

        resultIcon.textContent =
            "✕";

    }

    else {

        resultScreen.classList.add(
            "info"
        );

        resultIcon.textContent =
            "✓";

    }


    resultTitle.textContent =
        title ||
        "Verification Result";


    resultMessage.textContent =
        message ||
        "";


    // Reset the button state whenever
    // a new verification result appears.

    const returnButton =
        document.getElementById(
            "returnButton"
        );


    if (returnButton) {

        returnButton.dataset.returned =
            "false";

    }


    const redirectText =
        document.getElementById(
            "redirectText"
        );


    if (redirectText) {

        redirectText.textContent =
            "Tap Return to Bot to continue.";

    }

}


// ==================================================
// RETURN TO BOT
// ==================================================

function returnToBot() {

    const button =
        document.getElementById(
            "returnButton"
        );


    // ==============================================
    // FIRST TAP
    // ==============================================

    if (
        button.dataset.returned !==
        "true"
    ) {

        // Open the return URL in another page/tab.
        // The current Telegram Mini App remains open.

        const newPage =
            window.open(
                RETURN_URL,
                "_blank"
            );


        // Mark first tap as completed.

        button.dataset.returned =
            "true";


        const redirectText =
            document.getElementById(
                "redirectText"
            );


        if (redirectText) {

            if (newPage) {

                redirectText.textContent =
                    "Return to this page and tap Return to Bot again to close.";

            }

            else {

                redirectText.textContent =
                    "Return to this page and tap Return to Bot again to close.";

            }

        }


        return;

    }


    // ==============================================
    // SECOND TAP
    // ==============================================

    // Close the Telegram Mini App.

    if (tg) {

        try {

            tg.close();

        }

        catch (error) {

            console.log(
                "Unable to close Telegram Mini App:",
                error
            );

        }

    }

}


// ==================================================
// SHA-256
// ==================================================

async function sha256(text) {

    const encoder =
        new TextEncoder();


    const data =
        encoder.encode(text);


    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );


    const hashArray =
        Array.from(
            new Uint8Array(
                hashBuffer
            )
        );


    return hashArray
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join("");

}


// ==================================================
// TELEGRAM DEVICE ID
// ==================================================

async function getTelegramDeviceId() {

    try {

        if (
            !tg ||
            !tg.BiometricManager
        ) {

            return null;

        }


        await new Promise(
            resolve => {

                try {

                    tg.BiometricManager.init(
                        function () {

                            resolve();

                        }
                    );

                }

                catch (error) {

                    resolve();

                }

            }
        );


        const deviceId =
            tg.BiometricManager.deviceId;


        if (
            deviceId &&
            typeof deviceId === "string" &&
            deviceId.length > 0
        ) {

            return (
                "tg-device-" +
                deviceId
            );

        }

    }

    catch (error) {

        console.log(
            "Telegram device ID unavailable:",
            error
        );

    }


    return null;

}


// ==================================================
// DEVICE FINGERPRINT
// ==================================================

async function getDeviceFingerprint() {

    try {

        // ------------------------------------------
        // Timezone
        // ------------------------------------------

        let timezone = "";

        try {

            timezone =
                Intl
                    .DateTimeFormat()
                    .resolvedOptions()
                    .timeZone || "";

        }

        catch (error) {

            timezone = "";

        }


        // ------------------------------------------
        // Language
        // ------------------------------------------

        const language =
            navigator.language || "";


        // ------------------------------------------
        // Languages
        // ------------------------------------------

        const languages =
            Array.isArray(
                navigator.languages
            )
                ? navigator.languages.join(",")
                : "";


        // ------------------------------------------
        // Screen information
        // ------------------------------------------

        const screenData = [

            screen.width || "",

            screen.height || "",

            screen.availWidth || "",

            screen.availHeight || "",

            screen.colorDepth || "",

            screen.pixelDepth || ""

        ].join(",");


        // ------------------------------------------
        // Navigator information
        // ------------------------------------------

        const navigatorData = [

            navigator.userAgent || "",

            navigator.platform || "",

            navigator.hardwareConcurrency || "",

            navigator.deviceMemory || "",

            navigator.maxTouchPoints || ""

        ].join("|");


        // ------------------------------------------
        // WebGL information
        // ------------------------------------------

        let webglData = "";


        try {

            const canvas =
                document.createElement(
                    "canvas"
                );


            const gl =
                canvas.getContext(
                    "webgl"
                ) ||
                canvas.getContext(
                    "experimental-webgl"
                );


            if (gl) {

                const debugInfo =
                    gl.getExtension(
                        "WEBGL_debug_renderer_info"
                    );


                if (debugInfo) {

                    const vendor =
                        gl.getParameter(
                            debugInfo.UNMASKED_VENDOR_WEBGL
                        );


                    const renderer =
                        gl.getParameter(
                            debugInfo.UNMASKED_RENDERER_WEBGL
                        );


                    webglData =
                        String(vendor) +
                        "|" +
                        String(renderer);

                }

            }

        }

        catch (error) {

            webglData = "";

        }


        // ------------------------------------------
        // Combine fingerprint
        // ------------------------------------------

        const fingerprintSource = [

            navigatorData,

            language,

            languages,

            timezone,

            screenData,

            webglData

        ].join("||");


        // ------------------------------------------
        // Hash
        // ------------------------------------------

        const hash =
            await sha256(
                fingerprintSource
            );


        return (
            "fingerprint-" +
            hash
        );

    }

    catch (error) {

        console.log(
            "Fingerprint failed:",
            error
        );


        return null;

    }

}


// ==================================================
// LOCAL FALLBACK
// ==================================================

function getLocalFallbackDeviceId() {

    try {

        let deviceId =
            localStorage.getItem(
                "tg_device_fallback"
            );


        if (!deviceId) {

            if (
                crypto &&
                typeof crypto.randomUUID ===
                    "function"
            ) {

                deviceId =
                    crypto.randomUUID();

            }

            else {

                deviceId =
                    Date.now()
                        .toString(36) +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2);

            }


            localStorage.setItem(
                "tg_device_fallback",
                deviceId
            );

        }


        return (
            "fallback-" +
            deviceId
        );

    }

    catch (error) {

        return (
            "fallback-" +
            Date.now()
                .toString(36) +
            "-" +
            Math.random()
                .toString(36)
                .substring(2)
        );

    }

}
